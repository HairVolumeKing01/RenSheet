<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RenSheet — 获取激活码</title>
<style>
:root {
  --blue-900: #0D2137; --blue-700: #1A4570; --blue-500: #2B6FA8; --blue-300: #7BB3DD;
  --blue-100: #D6EAF5; --blue-50: #EDF5FA; --gray-700: #4A5568; --gray-400: #A0AEC0;
  --gray-200: #E2E8F0; --gray-100: #F7FAFC; --white: #FFFFFF; --radius: 8px;
  --font: 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:var(--font); background:var(--gray-100); color:var(--gray-700);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
}
.card {
  background:var(--white); border-radius:12px; padding:40px 36px;
  max-width:500px; width:90%; border:1px solid var(--gray-200);
  box-shadow:0 4px 16px rgba(0,0,0,0.06);
}
h2 { font-size:22px; font-weight:600; color:var(--blue-900); margin:0 0 4px; letter-spacing:2px; text-align:center; }
.subtitle { font-size:13px; color:var(--gray-400); margin:0 0 24px; text-align:center; }

.steps { background:var(--blue-50); border-radius:8px; padding:16px 20px; margin-bottom:24px; text-align:left; }
.steps ol { margin:0; padding:0 0 0 18px; font-size:13px; color:var(--gray-700); line-height:2; }
.steps ol li::marker { color:var(--blue-500); font-weight:600; }

.input-wrap { display:flex; gap:8px; margin-bottom:14px; }
.input-text { flex:1; padding:12px 16px; border:2px solid var(--gray-200); border-radius:8px; font-size:15px; outline:none; transition:border-color 0.25s; }
.input-text:focus { border-color:var(--blue-500); }
.btn { padding:12px 24px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; letter-spacing:1px; transition:all 0.25s; background:var(--blue-700); color:#fff; white-space:nowrap; }
.btn:hover { background:var(--blue-500); }
.hint { font-size:12px; color:var(--gray-400); text-align:center; margin-bottom:0; }

.result { margin-top:14px; padding:16px; border-radius:8px; font-size:14px; display:none; text-align:center; }
.result.success { display:block; background:#C6F6D5; color:#276749; }
.result.error { display:block; background:#FED7D7; color:#C53030; }
.result code { display:block; font-size:18px; letter-spacing:2px; margin:10px 0; font-weight:700; background:rgba(255,255,255,0.5); padding:10px 14px; border-radius:4px; word-break:break-all; }
.result .meta { font-size:12px; color:var(--gray-700); margin-top:4px; }
.copy-btn { display:inline-block; margin-top:8px; padding:8px 20px; border:none; border-radius:6px; background:var(--blue-500); color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
.copy-btn:hover { background:var(--blue-700); }

.links { margin-top:20px; text-align:center; }
.links a { display:inline-block; margin:0 10px; font-size:13px; color:var(--blue-500); text-decoration:none; }
.links a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="card">
  <h2>获取激活码</h2>
  <p class="subtitle">赞助成功后在此领取您的 RenSheet 激活码</p>

  <div class="steps">
    <ol>
      <li>前往 <a href="https://www.ifdian.net/a/baiyanxi" target="_blank" style="color:var(--blue-500);font-weight:600;text-decoration:none;">爱发电</a> 赞助 RenSheet（月费 5 元 / 年费 30 元）</li>
      <li>付款成功后，复制订单页面上显示的<strong>订单号</strong></li>
      <li>回到本页面，在下方输入框中粘贴订单号</li>
      <li>点击「查询」获取激活码，复制后前往国际表激活</li>
    </ol>
  </div>

  <div class="input-wrap">
    <input type="text" id="order-input" class="input-text" placeholder="输入您的订单号" autocomplete="off">
    <button class="btn" id="query-btn" onclick="doQuery()">查询</button>
  </div>
  <p class="hint">订单号在爱发电付款成功页面显示，通常是一串数字</p>

  <div id="result" class="result"></div>

  <div class="links">
    <a href="https://www.ifdian.net/a/baiyanxi" target="_blank">→ 前往爱发电赞助</a>
    <a href="guoji.html">→ 返回国际表激活</a>
  </div>
</div>

<script>
var API = 'https://api.rensheet.top';

document.getElementById('order-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doQuery();
});

async function doQuery() {
  var q = document.getElementById('order-input').value.trim();
  var resultEl = document.getElementById('result');
  if (!q) { resultEl.className = 'result error'; resultEl.innerHTML = '请输入您的订单号'; return; }

  var btn = document.getElementById('query-btn');
  btn.textContent = '查询中...'; btn.disabled = true;

  try {
    var resp = await fetch(API + '/api/get-code?order=' + encodeURIComponent(q));
    var data = await resp.json();
    if (data.ok) {
      resultEl.className = 'result success';
      // Build result with DOM API for security (data.code must not touch innerHTML)
      resultEl.innerHTML = '';
      resultEl.appendChild(document.createTextNode('您的激活码：'));
      var codeEl = document.createElement('code');
      codeEl.textContent = data.code;
      resultEl.appendChild(codeEl);
      var copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = '复制激活码';
      (function(c) { copyBtn.addEventListener('click', function() { copyCode(c); }); })(data.code);
      resultEl.appendChild(copyBtn);
      var meta1 = document.createElement('p');
      meta1.className = 'meta';
      meta1.textContent = (data.plan === 'monthly' ? '月费' : '年费')
        + ' · 有效期至 ' + new Date(data.expires_at).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
      resultEl.appendChild(meta1);
      var meta2 = document.createElement('p');
      meta2.className = 'meta';
      meta2.style.marginTop = '4px';
      meta2.innerHTML = '请复制激活码，打开 <a href="guoji.html" style="color:#2B6FA8;">国际表</a> 页面粘贴激活';
      resultEl.appendChild(meta2);
    } else {
      resultEl.className = 'result error';
      resultEl.textContent = (data.message || '未找到激活码');
      var hint = document.createElement('span');
      hint.style.cssText = 'font-size:12px;display:block;margin-top:4px;';
      hint.textContent = '可能原因：付款尚未处理（请等待 1-2 分钟）、输入的订单号有误、或订单未成功。如持续无法获取，请联系客服。';
      resultEl.appendChild(hint);
    }
  } catch(e) {
    resultEl.className = 'result error';
    resultEl.innerHTML = '网络错误，请稍后重试';
  }
  btn.textContent = '查询'; btn.disabled = false;
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(function(){
    var btn = document.querySelector('.copy-btn');
    if (btn) { btn.textContent = '已复制!'; }
    setTimeout(function(){ if (btn) btn.textContent = '复制激活码'; }, 1500);
  });
}
</script>
</body>
</html>
